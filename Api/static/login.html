<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign In — OCR for Imaged PDF</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#f7f5f2;--surface:#fff;--border:#e2ddd7;--text:#1c1917;
      --text-muted:#78716c;--accent:#c2410c;--accent-soft:#fff1ec;
      --shadow-md:0 4px 12px rgba(0,0,0,.08),0 2px 4px rgba(0,0,0,.04);
    }
    body{
      min-height:100vh;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;
      display:flex;align-items:center;justify-content:center;padding:1.5rem;
    }
    /* subtle paper-rule texture */
    body::before{
      content:'';position:fixed;inset:0;pointer-events:none;
      background-image:repeating-linear-gradient(90deg,transparent,transparent 78px,rgba(0,0,0,.025) 78px,rgba(0,0,0,.025) 79px);
    }
    .card{
      position:relative;background:var(--surface);border:1px solid var(--border);border-radius:14px;
      padding:3.25rem 2.75rem;width:min(420px,92vw);text-align:center;box-shadow:var(--shadow-md);
    }
    .logo-mark{font-family:'Lora',serif;font-size:3rem;line-height:1;color:var(--accent);margin-bottom:.4rem}
    .title{font-family:'Lora',serif;font-size:1.5rem;font-weight:600;letter-spacing:-.01em;margin-bottom:.35rem}
    .subtitle{font-size:.8rem;color:var(--text-muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:2.25rem}
    .divider{width:42px;height:2px;background:var(--accent);margin:0 auto 2.25rem;border-radius:2px}

    .sign-in-btn{
      display:flex;align-items:center;justify-content:center;gap:.75rem;width:100%;
      padding:.9rem 1.5rem;background:var(--surface);color:#3c4043;border:1.5px solid #dadce0;border-radius:9px;
      font-family:'DM Sans',sans-serif;font-size:.92rem;font-weight:600;text-decoration:none;cursor:pointer;
      transition:background .15s,box-shadow .15s,transform .1s;
    }
    .sign-in-btn:hover{background:#faf9f7;box-shadow:var(--shadow-md);transform:translateY(-1px)}
    .sign-in-btn:active{transform:translateY(0)}
    .google-icon{width:19px;height:19px;flex-shrink:0}

    .footnote{font-size:.72rem;color:var(--text-muted);margin-top:2rem;letter-spacing:.04em}
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-mark">文</div>
    <div class="title">OCR for Imaged PDF</div>
    <div class="subtitle">Image PDF · CJK · Vertical Text</div>
    <div class="divider"></div>

    <a href="/auth/login" class="sign-in-btn">
      <svg class="google-icon" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      Sign in with Google
    </a>

    <p class="footnote">Private · Single-user · Self-hosted</p>
  </div>
</body>
</html>
